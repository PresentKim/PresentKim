<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Quest Log</title>
  <desc id="desc">A concise list of ongoing creative goals.</desc>
  <!-- Quest entries describe ongoing interests rather than claims about active projects -->
  <rect width="1000" height="260" rx="18" fill="#FFFFFF" stroke="#D9DED6"/>
  <text x="42" y="53" fill="#202522" font-family="Arial, sans-serif" font-size="20" font-weight="700">QUEST LOG</text>
  <text x="43" y="76" fill="#788273" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.2">CURRENT DIRECTIONS</text>
  <g font-family="Arial, sans-serif">
    <rect x="42" y="100" width="916" height="42" rx="6" fill="#F1F4EF"/>
    <rect x="42" y="153" width="916" height="42" rx="6" fill="#F1F4EF"/>
    <rect x="42" y="206" width="916" height="30" rx="6" fill="#F1F4EF"/>
    <circle cx="65" cy="121" r="6" fill="#78B65D"/>
    <circle cx="65" cy="174" r="6" fill="#78B65D"/>
    <circle cx="65" cy="221" r="6" fill="#AAB4A6"/>
    <text x="84" y="125" fill="#263025" font-size="13" font-weight="700">Create useful Minecraft Bedrock experiences</text>
    <text x="84" y="178" fill="#263025" font-size="13" font-weight="700">Explore ideas through small, enjoyable projects</text>
    <text x="84" y="225" fill="#657060" font-size="12">Keep learning by making</text>
    <text x="930" y="125" text-anchor="end" fill="#3E7F32" font-size="10" font-weight="700">ONGOING</text>
    <text x="930" y="178" text-anchor="end" fill="#3E7F32" font-size="10" font-weight="700">ONGOING</text>
    <text x="930" y="225" text-anchor="end" fill="#8A9485" font-size="10" font-weight="700">ALWAYS</text>
  </g>
</svg>
