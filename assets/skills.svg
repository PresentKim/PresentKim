<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Skill Tree</title>
  <desc id="desc">Development interests and technologies, without implying measured proficiency.</desc>
  <!-- Skill nodes are interests and focus areas, not numerical skill ratings -->
  <rect width="1000" height="390" rx="18" fill="#202522"/>
  <text x="42" y="55" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">SKILL TREE</text>
  <text x="43" y="78" fill="#A9B5A6" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.2">AREAS OF INTEREST & DEVELOPMENT</text>
  <path d="M500 122 V151 M250 151 H750 M250 151 V174 M500 151 V174 M750 151 V174" stroke="#5B7555" stroke-width="2" fill="none"/>
  <g font-family="Arial, sans-serif">
    <rect x="85" y="174" width="330" height="145" rx="9" fill="#2C352E" stroke="#55734D"/>
    <rect x="435" y="174" width="250" height="145" rx="9" fill="#2C352E" stroke="#55734D"/>
    <rect x="705" y="174" width="210" height="145" rx="9" fill="#2C352E" stroke="#55734D"/>
    <circle cx="117" cy="207" r="9" fill="#78B65D"/>
    <text x="139" y="212" fill="#FFFFFF" font-size="15" font-weight="700">MINECRAFT BEDROCK</text>
    <text x="108" y="247" fill="#B9C6B6" font-size="13">PocketMine-MP (PMMP)</text>
    <text x="108" y="272" fill="#B9C6B6" font-size="13">Plugins · Add-ons · Game systems</text>
    <text x="108" y="299" fill="#78B65D" font-size="10" font-weight="700" letter-spacing="1">MAIN SPECIALIZATION</text>
    <circle cx="467" cy="207" r="9" fill="#78B65D"/>
    <text x="489" y="212" fill="#FFFFFF" font-size="15" font-weight="700">BACKEND</text>
    <text x="458" y="247" fill="#B9C6B6" font-size="13">PHP</text>
    <text x="458" y="272" fill="#B9C6B6" font-size="13">Server-side development</text>
    <text x="458" y="299" fill="#78B65D" font-size="10" font-weight="700" letter-spacing="1">TOOLS & LOGIC</text>
    <circle cx="737" cy="207" r="9" fill="#78B65D"/>
    <text x="759" y="212" fill="#FFFFFF" font-size="15" font-weight="700">FRONTEND</text>
    <text x="728" y="247" fill="#B9C6B6" font-size="13">JavaScript · React</text>
    <text x="728" y="272" fill="#B9C6B6" font-size="13">Web interfaces</text>
    <text x="728" y="299" fill="#78B65D" font-size="10" font-weight="700" letter-spacing="1">UI & EXPERIENCE</text>
  </g>
  <text x="500" y="357" text-anchor="middle" fill="#879487" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.4">LEARN BY BUILDING · BUILD BY CURIOSITY</text>
</svg>
