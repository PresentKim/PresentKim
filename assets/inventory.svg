<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Project Inventory</title>
  <desc id="desc">Inventory-style slots for selected projects. Replace placeholder entries with repository links.</desc>
  <!-- Empty project slots are intentionally placeholders until repository names and URLs are supplied -->
  <rect width="1000" height="300" rx="18" fill="#F1F3EE"/>
  <text x="42" y="54" fill="#202522" font-family="Arial, sans-serif" font-size="20" font-weight="700">PROJECT INVENTORY</text>
  <text x="43" y="77" fill="#788273" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.2">SELECTED BUILDS · REPOSITORY SLOTS</text>
  <g>
    <rect x="42" y="105" width="290" height="150" rx="9" fill="#FFFFFF" stroke="#D7DED3"/>
    <rect x="355" y="105" width="290" height="150" rx="9" fill="#FFFFFF" stroke="#D7DED3"/>
    <rect x="668" y="105" width="290" height="150" rx="9" fill="#FFFFFF" stroke="#D7DED3"/>
    <g fill="#E7EEE3" stroke="#C9D8C3">
      <rect x="62" y="125" width="48" height="48" rx="6"/>
      <rect x="375" y="125" width="48" height="48" rx="6"/>
      <rect x="688" y="125" width="48" height="48" rx="6"/>
    </g>
    <g fill="#3E7F32" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
      <text x="86" y="157">01</text><text x="399" y="157">02</text><text x="712" y="157">03</text>
    </g>
    <g font-family="Arial, sans-serif">
      <text x="124" y="143" fill="#202522" font-size="14" font-weight="700">PROJECT SLOT</text>
      <text x="124" y="163" fill="#788273" font-size="11">Minecraft / PMMP</text>
      <text x="62" y="207" fill="#697466" font-size="11">Add repository name and link</text>
      <text x="375" y="207" fill="#697466" font-size="11">Add repository name and link</text>
      <text x="688" y="207" fill="#697466" font-size="11">Add repository name and link</text>
      <text x="62" y="232" fill="#3E7F32" font-size="10" font-weight="700" letter-spacing="1">OPEN REPOSITORY  ↗</text>
      <text x="375" y="232" fill="#3E7F32" font-size="10" font-weight="700" letter-spacing="1">OPEN REPOSITORY  ↗</text>
      <text x="688" y="232" fill="#3E7F32" font-size="10" font-weight="700" letter-spacing="1">OPEN REPOSITORY  ↗</text>
    </g>
  </g>
</svg>
