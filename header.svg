<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">PresentKim — Player Profile</title>
  <desc id="desc">A clean RPG-inspired profile header with a green accent.</desc>
  <!-- Warm light canvas with a dark game-menu panel -->
  <rect width="1000" height="260" rx="18" fill="#F1F3EE"/>
  <rect x="18" y="18" width="964" height="224" rx="14" fill="#202522"/>
